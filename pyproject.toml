[project]
name = "searchhax"
version = "0.1.0"
description = "FrontierGraph retrieval adapters, including targeted Tavily search and extraction."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["searchhax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
